<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>

   <link rel="stylesheet" href="./temp.css">
</head>

<body>
   <h1>Payment form</h1>
   <p>required fields are followed by <strong>*</strong></p>
   <h2>Contact information</h2>
   <form action="./" method="get">
      <fieldset>
         <legend>Title</legend>
         <ul>
            <li>
               <input type="radio" id="king" name="title" value="king">
               <label for="king">King</label>
            </li>
            <li>
               <input type="radio" id="queen" name="title" value="queen">
               <label for="queen">Queen</label>
            </li>
            <li>
               <input type="radio" id="ace" name="title" value="ace">
               <label for="ace">Ace</label>
            </li>
         </ul>


      </fieldset>

      <div class="contact-info">
         <label for="name">Name:*
            <input type="text" id="name">

         </label>

         <label for="email">Email:*
            <input type="email" name="email" id="email">

         </label>

         <label for="password">Password:*
            <input type="password" name="password" id="password">
         </label>
      </div>

      <h2>Payment information</h2>
      <div class="payment-info">

         <label for="cardTipe">Card Type:*
            <select id="cardTipe">
               <option value="visa">visa</option>
               <option value="master">master</option>
               <option value="american">American Express</option>
            </select>

         </label>

         <label for="card-number">Card Number:*
            <input type="tel" name="card-number" id="card-number">

         </label>

         <label for="exprirationDate">Expiration Date:*
            <input type="text" id="expiration" name="expiration" required placeholder="MM/YY"
               pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" />

         </label>
      </div>

      <button type="submit">Validate Payment</button>
   </form>
</body>

</html>
