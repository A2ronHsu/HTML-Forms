<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>HTML forms practice</title>
   <link rel="stylesheet" href="style.css">
   <script src="./script.js" defer></script>
</head>
<body>
   <label for="contact" id="formLabel">
      
      <form action="./get" method="get" id="contact">
         <ul>
            <li>
               <label for="name">
                  Name:
               </label>
               <input type="text" id="name">
            </li>
            <li>
               <label for="email">
                  E-mail:
               </label>
               <input type="text" id="email">
            </li>
            <li>
               <label for="message"> 
                  Message:

               </label>
                   <textarea name="message" id="message">
   
                  </textarea>
            </li>
            <li id="button">
               <label for="submit"></label>
               <button type="submit" id="submit">Send your message</button>
            </li>
         </ul>
      </form>

   </label>
</body>
</html>
